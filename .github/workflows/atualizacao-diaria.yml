name: Atualizacao diaria

on:
  schedule:
    - cron: "0 4 * * *"   # 01:00 BRT (sem horario de verao)
  workflow_dispatch: {}

concurrency:
  group: atualizacao-diaria
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Escreve credencial do Google (Sheets/Merchant Center)
        run: echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_B64 }}" | base64 -d > google_service_account.json

      - name: Roda atualizacao diaria
        env:
          GITHUB_ACTIONS: "true"
          VNDA_API_TOKEN: ${{ secrets.VNDA_API_TOKEN }}
          GITHUB_PAGES_TOKEN: ${{ secrets.GITHUB_PAGES_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python atualizacao_diaria.py
